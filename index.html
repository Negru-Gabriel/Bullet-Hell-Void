'use strict';
// ============================================================
//  BULLET HELL: VOID  —  game.js
//  Full game engine: Audio, Particles, Bullets, Bosses, HUD
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;   // 460 — read from HTML canvas attribute
const H = canvas.height;  // 560 — read from HTML canvas attribute

// ── Audio Engine ────────────────────────────────────────────
class AudioEngine {
  constructor() {
    this.enabled = true;
    this.ac = null;
    this.masterGain = null;
    this.bgmNodes = [];
    this.bgmRunning = false;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        this.ac = new AC();
        this.masterGain = this.ac.createGain();
        this.masterGain.gain.value = 0.55;
        this.masterGain.connect(this.ac.destination);
      } else {
        this.enabled = false;
      }
    } catch(e) { this.ac = null; this.enabled = false; }
  }
  resume() {
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  }
  setMute(muted) {
    if (!this.masterGain) return;
    this.masterGain.gain.value = muted ? 0 : 0.55;
  }
  _osc(type, freq, gainVal, duration, dest) {
    if (!this.ac || !this.enabled) return;
    try {
      const g = this.ac.createGain();
      g.gain.setValueAtTime(gainVal, this.ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ac.currentTime + duration);
      g.connect(dest || this.masterGain);
      const o = this.ac.createOscillator();
      o.type = type; o.frequency.value = freq;
      o.connect(g);
      o.start(); o.stop(this.ac.currentTime + duration);
    } catch(e) {}
  }
  _noise(gainVal, duration, freq1, freq2) {
    if (!this.ac || !this.enabled) return;
    try {
      const bufSize = this.ac.sampleRate * Math.min(duration, 1);
      const buf = this.ac.createBuffer(1, bufSize, this.ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ac.createBufferSource();
      src.buffer = buf;
      const filter = this.ac.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(freq1, this.ac.currentTime);
      filter.frequency.exponentialRampToValueAtTime(freq2, this.ac.currentTime + duration * 0.5);
      filter.Q.value = 1.5;
      const g = this.ac.createGain();
      g.gain.setValueAtTime(gainVal, this.ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ac.currentTime + duration);
      src.connect(filter); filter.connect(g); g.connect(this.masterGain);
      src.start(); src.stop(this.ac.currentTime + duration);
    } catch(e) {}
  }
  sfxShoot() {
    this._osc('sine', 880, 0.08, 0.07);
    this._osc('square', 1200, 0.04, 0.05);
  }
  sfxEnemyHit() { this._noise(0.12, 0.08, 400, 800); }
  sfxExplosion() {
    this._noise(0.35, 0.6, 80, 40);
    this._osc('sawtooth', 120, 0.12, 0.3);
  }
  sfxPlayerHit() {
    this._noise(0.4, 0.5, 200, 60);
    this._osc('sawtooth', 80, 0.2, 0.4);
  }
  sfxBossPhase() {
    const notes = [220, 277, 330, 440, 554, 659, 880];
    notes.forEach((f, i) => {
      setTimeout(() => this._osc('sine', f, 0.15, 0.2), i * 80);
    });
  }
  sfxPowerUp() {
    [440, 554, 659, 880, 1108].forEach((f, i) => {
      setTimeout(() => this._osc('sine', f, 0.12, 0.15), i * 60);
    });
  }
  sfxDeath() {
    [440, 330, 220, 110, 55].forEach((f, i) => {
      setTimeout(() => this._osc('sawtooth', f, 0.2, 0.3), i * 100);
    });
    setTimeout(() => this._noise(0.3, 0.8, 300, 50), 200);
  }
  sfxVictory() {
    const melody = [523,659,784,1047,784,659,523,440,523,659,784,1047];
    melody.forEach((f,i) => setTimeout(() => this._osc('sine', f, 0.15, 0.25), i*120));
  }
  sfxBomb() {
    this._noise(0.5, 1.2, 60, 30);
    this._osc('sine', 60, 0.3, 0.8);
    this._osc('sawtooth', 120, 0.2, 0.6);
  }

  startBGM(bossIndex) {
    this.stopBGM();
    if (!this.ac || !this.enabled) return;
    this.bgmRunning = true;
    this._buildBGM(bossIndex);
  }
  stopBGM() {
    this.bgmRunning = false;
    this.bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
    this.bgmNodes = [];
  }
  _buildBGM(bossIndex) {
    if (!this.ac || !this.bgmRunning) return;
    const t = this.ac.currentTime;
    // Chord progressions per boss
    const progressions = [
      [110, 138.59, 164.81, 207.65], // Boss 1: Am-C-Em-G
      [146.83, 174.61, 195.99, 246.94], // Boss 2: Dm-F-G-B
      [82.41, 103.83, 130.81, 155.56]  // Boss 3: Em-Ab-C-Eb
    ];
    const prog = progressions[bossIndex % 3];
    const tempo = 0.4 + bossIndex * 0.05;

    // Sub bass
    const bassGain = this.ac.createGain();
    bassGain.gain.value = 0.18;
    bassGain.connect(this.masterGain);
    prog.forEach((f, i) => {
      const o = this.ac.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(bassGain);
      o.start(t + i * tempo * 4);
      o.stop(t + i * tempo * 4 + tempo * 4);
      this.bgmNodes.push(o);
    });

    // Lead synth
    const leadGain = this.ac.createGain();
    leadGain.gain.value = 0.06;
    const filter = this.ac.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 800 + bossIndex * 200;
    filter.Q.value = 8;
    leadGain.connect(filter); filter.connect(this.masterGain);

    const melody = [1,3,5,7,5,3,1,0,1,3,5,8,7,5,3,1];
    melody.forEach((step, i) => {
      const freq = prog[0] * Math.pow(2, step/12) * 4;
      const o = this.ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = freq;
      o.connect(leadGain);
      o.start(t + i * tempo);
      o.stop(t + i * tempo + tempo * 0.8);
      this.bgmNodes.push(o);
    });

    // Pad
    const padGain = this.ac.createGain();
    padGain.gain.value = 0.04;
    padGain.connect(this.masterGain);
    prog.forEach(f => {
      [1, 1.5, 2].forEach(mult => {
        const o = this.ac.createOscillator();
        o.type = 'sine'; o.frequency.value = f * mult * 2;
        o.detune.value = (Math.random() - 0.5) * 10;
        o.connect(padGain);
        o.start(t); o.stop(t + tempo * 16);
        this.bgmNodes.push(o);
      });
    });

    // Schedule loop
    const loopTime = tempo * 16 * 1000;
    if (this.bgmRunning) {
      this._bgmTimer = setTimeout(() => {
        if (this.bgmRunning) this._buildBGM(bossIndex);
      }, loopTime - 100);
    }
  }
}

// ── Particle System ──────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, color, life, size, glow) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = life; this.maxLife = life;
    this.size = size;
    this.glow = glow || false;
    this.alpha = 1;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += 60 * dt;
    this.vx *= 0.98;
    this.life -= dt;
    this.alpha = Math.max(0, this.life / this.maxLife);
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    if (this.glow) {
      ctx.shadowBlur = 12;
      ctx.shadowColor = this.color;
    }
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class ParticleSystem {
  constructor() { this.particles = []; }
  emit(x, y, count, colors, speedRange, lifeRange, sizeRange, glowColors) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
      const life = lifeRange[0] + Math.random() * (lifeRange[1] - lifeRange[0]);
      const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
      const color = colors[Math.floor(Math.random() * colors.length)];
      const glow = glowColors ? glowColors.includes(color) : false;
      this.particles.push(new Particle(
        x + (Math.random()-0.5)*6, y + (Math.random()-0.5)*6,
        Math.cos(angle)*speed, Math.sin(angle)*speed,
        color, life, size, glow
      ));
    }
  }
  emitExplosion(x, y, colors) {
    this.emit(x, y, 30, colors, [60, 220], [0.4, 1.2], [2, 6], colors);
    this.emit(x, y, 15, ['#ffffff', '#ffffcc'], [20, 80], [0.2, 0.5], [1, 3], null);
  }
  emitTrail(x, y, color) {
    this.emit(x, y, 2, [color, '#ffffff'], [10, 40], [0.1, 0.3], [1, 2.5], [color]);
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (this.particles[i].life <= 0) this.particles.splice(i, 1);
    }
  }
  draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
  clear() { this.particles = []; }
}

// ── Bullet ────────────────────────────────────────────────────
class Bullet {
  constructor(x, y, vx, vy, radius, color, glow, owner) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.radius = radius;
    this.color = color;
    this.glow = glow || color;
    this.owner = owner; // 'player' | 'enemy'
    this.alive = true;
    this.trail = [];
  }
  update(dt) {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 8) this.trail.shift();
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20) this.alive = false;
  }
  draw(ctx) {
    // Trail
    ctx.save();
    for (let i = 0; i < this.trail.length; i++) {
      const a = (i / this.trail.length) * 0.4;
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.radius * (i/this.trail.length) * 0.7, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = this.owner === 'player' ? 14 : 18;
    ctx.shadowColor = this.glow;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    // Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Player ────────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = W / 2;
    this.y = H - 80;
    this.speed = 240;
    this.focusSpeed = 90;
    this.radius = 5; // hitbox radius
    this.shootRadius = 16; // visual size
    this.bullets = [];
    this.shootTimer = 0;
    this.shootInterval = 0.09;
    this.lives = 3;
    this.bombs = 3;
    this.score = 0;
    this.power = 1;
    this.invincible = 0;
    this.alive = true;
    this.deathTimer = 0;
    this.engineFlicker = 0;
    this.graze = 0;
    this.grazeTimer = 0;
    this.isFocus = false;
    this.angle = 0;
  }
  update(dt, keys, audio, particles) {
    if (!this.alive) {
      this.deathTimer -= dt;
      return;
    }
    if (this.invincible > 0) this.invincible -= dt;
    this.isFocus = keys['ShiftLeft'] || keys['ShiftRight'];
    const spd = this.isFocus ? this.focusSpeed : this.speed;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    this.x = Math.max(10, Math.min(W-10, this.x + dx * spd * dt));
    this.y = Math.max(10, Math.min(H-10, this.y + dy * spd * dt));

    // Shoot
    this.shootTimer -= dt;
    if ((keys['KeyZ'] || keys['Space']) && this.shootTimer <= 0) {
      this.shootTimer = this.shootInterval;
      this._shoot(audio);
    }

    // Engine particles
    this.engineFlicker += dt * 20;
    if (Math.random() < 0.6) {
      particles.emit(
        this.x + (Math.random()-0.5)*8,
        this.y + 20,
        1, ['#00ccff','#0088ff','#ffffff'], [20, 60], [0.15, 0.35], [1.5, 3], ['#00ccff']
      );
    }

    // Graze timer
    if (this.grazeTimer > 0) this.grazeTimer -= dt;

    // Update bullets
    for (let i = this.bullets.length-1; i >= 0; i--) {
      this.bullets[i].update(dt);
      if (!this.bullets[i].alive) this.bullets.splice(i, 1);
    }
    this.angle += dt * 0.5;
  }
  _shoot(audio) {
    audio.sfxShoot();
    const pow = this.power;
    const spreadConfigs = [
      [{dx:0}],
      [{dx:-5},{dx:5}],
      [{dx:0},{dx:-9},{dx:9}],
      [{dx:0},{dx:-9},{dx:9},{dx:-18},{dx:18}],
      [{dx:0},{dx:-9},{dx:9},{dx:-18},{dx:18},{dx:-27},{dx:27}]
    ];
    const cfg = spreadConfigs[Math.min(pow-1, 4)];
    cfg.forEach(c => {
      const vx = c.dx ? (c.dx > 0 ? 30 : -30) : 0;
      this.bullets.push(new Bullet(
        this.x + (c.dx||0)*0.4, this.y - 10,
        vx * 2 + (c.dx ? (c.dx/Math.abs(c.dx))*Math.abs(c.dx)*0.5 : 0),
        -650, 4.5, '#44ffff', '#00ffff', 'player'
      ));
    });
  }
  bomb(audio, particles, enemyBullets) {
    if (this.bombs <= 0 || !this.alive) return;
    this.bombs--;
    this.invincible = 3;
    audio.sfxBomb();
    particles.emitExplosion(this.x, this.y, ['#ffffff','#00ffff','#8800ff','#ff88ff']);
    for (let i = 0; i < 80; i++) {
      const angle = (i/80) * Math.PI*2;
      particles.emit(W/2, H/2, 1, ['#00ffff','#8800ff','#ffffff'], [100,300],[0.5,1.5],[2,5],['#00ffff','#8800ff']);
    }
    // Clear enemy bullets
    enemyBullets.length = 0;
  }
  hit(audio, particles) {
    if (this.invincible > 0 || !this.alive) return false;
    audio.sfxPlayerHit();
    this.lives--;
    this.invincible = 2.5;
    particles.emitExplosion(this.x, this.y, ['#ff4444','#ff8800','#ffff00','#ffffff']);
    if (this.lives <= 0) {
      this.alive = false;
      this.deathTimer = 2;
      audio.sfxDeath();
      particles.emitExplosion(this.x, this.y, ['#ff0000','#ff8800','#ffff44']);
    }
    return true;
  }
  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    // Invincibility flicker
    if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) {
      ctx.restore();
      return;
    }
    ctx.translate(this.x, this.y);

    // Engine glow base
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0088ff';

    // Main body
    ctx.fillStyle = '#ddeeff';
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-12, 16);
    ctx.lineTo(-5, 8);
    ctx.lineTo(0, 12);
    ctx.lineTo(5, 8);
    ctx.lineTo(12, 16);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#00eeff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-5, 0);
    ctx.lineTo(5, 0);
    ctx.closePath();
    ctx.fill();

    // Wing accents
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-12, 16); ctx.lineTo(-8, 4); ctx.lineTo(-3, 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(12, 16); ctx.lineTo(8, 4); ctx.lineTo(3, 10);
    ctx.stroke();

    // Focus mode: show hitbox
    if (this.isFocus) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI*2);
      ctx.stroke();
      // Cross
      ctx.beginPath();
      ctx.moveTo(-this.radius*2, 0); ctx.lineTo(this.radius*2, 0);
      ctx.moveTo(0, -this.radius*2); ctx.lineTo(0, this.radius*2);
      ctx.stroke();
    }

    ctx.restore();

    // Graze indicator
    if (this.grazeTimer > 0) {
      ctx.save();
      ctx.globalAlpha = this.grazeTimer;
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10; ctx.shadowColor = '#ffff00';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 24, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }
  drawBullets(ctx) { this.bullets.forEach(b => b.draw(ctx)); }
}

// ── Stars Background ──────────────────────────────────────────
class Starfield {
  constructor() {
    this.stars = [];
    for (let i = 0; i < 200; i++) {
      this.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 20 + Math.random() * 100,
        size: Math.random() * 2.5,
        brightness: 0.3 + Math.random() * 0.7,
        color: Math.random() < 0.15 ? (Math.random()<0.5?'#aa88ff':'#88aaff') : '#ffffff'
      });
    }
    // Nebula blobs
    this.nebulas = Array.from({length:5}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: 80+Math.random()*140,
      color: ['#1a0030','#000818','#100020','#080014'][Math.floor(Math.random()*4)],
      vy: 5+Math.random()*10
    }));
  }
  update(dt) {
    this.stars.forEach(s => {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    });
    this.nebulas.forEach(n => {
      n.y += n.vy * dt;
      if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random()*W; }
    });
  }
  draw(ctx) {
    // Nebulas
    this.nebulas.forEach(n => {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, n.color+'88');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    });
    // Stars
    this.stars.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.brightness;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }
}

// ── Boss Base ─────────────────────────────────────────────────
class Boss {
  constructor(name, maxHp, phases, color, x, y) {
    this.name = name;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.phases = phases;
    this.phase = 0;
    this.color = color;
    this.x = x || W/2;
    this.y = y || 130;
    this.targetX = W/2;
    this.targetY = 130;
    this.alive = true;
    this.bullets = [];
    this.attackTimer = 0;
    this.attackIndex = 0;
    this.attackPattern = 0;
    this.patternTimer = 0;
    this.angle = 0;
    this.introTimer = 2;
    this.radius = 40;
    this.glowPulse = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.dead = false;
    this.deathTimer = 0;
    this.moveTimer = 0;
    this.moveDuration = 2.5;
    this.startX = W/2;
    this.startY = -80;
    this.introDone = false;
  }
  getPhaseThreshold() {
    return this.phases.map((_, i) => 1 - (i+1)/this.phases.length);
  }
  update(dt, playerX, playerY, audio, particles) {
    this.glowPulse += dt * 3;
    this.angle += dt * 0.8;
    this.shakeX *= 0.85;
    this.shakeY *= 0.85;

    // Intro slide in
    if (!this.introDone) {
      this.introTimer -= dt;
      const t = Math.max(0, Math.min(1, 1 - this.introTimer / 2));
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      this.x = this.startX;
      this.y = this.startY + (this.targetY - this.startY) * ease;
      if (this.introTimer <= 0) { this.introDone = true; this.y = this.targetY; }
      return;
    }

    // Phase transitions
    const hpRatio = this.hp / this.maxHp;
    const thresholds = this.getPhaseThreshold();
    let newPhase = 0;
    for (let i = 0; i < thresholds.length; i++) {
      if (hpRatio <= thresholds[i] + 0.001) newPhase = Math.min(i+1, this.phases.length-1);
    }
    if (newPhase !== this.phase) {
      this.phase = newPhase;
      this.patternTimer = 0;
      this.attackTimer = 0;
      this.attackIndex = 0;
      audio.sfxBossPhase();
      particles.emitExplosion(this.x, this.y, this._getPhaseColors());      this.shakeX = 12; this.shakeY = 12;
    }

    // Movement
    this.moveTimer += dt;
    if (this.moveTimer >= this.moveDuration) {
      this.moveTimer = 0;
      this.moveDuration = 1.5 + Math.random() * 2;
      const margin = 60;
      this.targetX = margin + Math.random() * (W - margin*2);
      this.targetY = 80 + Math.random() * 140;
    }
    const dx = this.targetX - this.x, dy = this.targetY - this.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const spd = 120 + this.phase * 40;
    if (dist > 4) {
      this.x += (dx/dist)*spd*dt;
      this.y += (dy/dist)*spd*dt;
    }

    // Attacks
    this.attackTimer -= dt;
    this.patternTimer += dt;
    if (this.attackTimer <= 0) {
      this.attackTimer = this.phases[this.phase].interval * (0.85 + Math.random()*0.3);
      this._firePattern(playerX, playerY, audio);
      this.attackIndex++;
    }

    // Update bullets
    for (let i = this.bullets.length-1; i >= 0; i--) {
      this.bullets[i].update(dt);
      if (!this.bullets[i].alive) this.bullets.splice(i,1);
    }

    // Check death
    if (this.hp <= 0 && !this.dead) {
      this.dead = true;
      this.deathTimer = 2;
      audio.sfxExplosion();
      for (let k=0;k<8;k++) setTimeout(()=>particles.emitExplosion(
        this.x+(Math.random()-0.5)*80,this.y+(Math.random()-0.5)*60,this._getPhaseColors()
      ), k*180);
    }
    if (this.dead) { this.deathTimer -= dt; if(this.deathTimer<=0) this.alive=false; }
  }
  _firePattern(px, py, audio) { /* overridden by subclass */ }
  _getPhaseColors() { return ['#8800ff','#cc44ff','#ffffff']; }
  _aimAngle(px, py) { return Math.atan2(py-this.y, px-this.x); }
  _spawnBullet(x, y, vx, vy, r, color, glow) {
    this.bullets.push(new Bullet(x,y,vx,vy,r,color,glow,'enemy'));
  }
  _ring(count, speed, r, color, glow, angleOffset) {
    const ao = angleOffset||0;
    for(let i=0;i<count;i++){
      const a = ao + (i/count)*Math.PI*2;
      this._spawnBullet(this.x,this.y,Math.cos(a)*speed,Math.sin(a)*speed,r,color,glow);
    }
  }
  _aimed(px, py, count, spread, speed, r, color, glow) {
    const base = this._aimAngle(px,py);
    for(let i=0;i<count;i++){
      const a = base + (i-(count-1)/2)*spread;
      this._spawnBullet(this.x,this.y,Math.cos(a)*speed,Math.sin(a)*speed,r,color,glow);
    }
  }
  _spiral(count, speed, r, color, glow) {
    const step = (Math.PI*2)/count;
    for(let i=0;i<count;i++){
      const a = this.angle*3 + i*step;
      this._spawnBullet(this.x,this.y,Math.cos(a)*speed,Math.sin(a)*speed,r,color,glow);
    }
  }
  hit(dmg, particles) {
    if(this.dead) return;
    this.hp = Math.max(0, this.hp-dmg);
    this.shakeX = 5+Math.random()*4; this.shakeY = 3+Math.random()*3;
    particles.emit(this.x+(Math.random()-0.5)*20,this.y+(Math.random()-0.5)*20,
      3,this._getPhaseColors(),[40,100],[0.2,0.5],[2,5],this._getPhaseColors());
  }
  draw(ctx) {
    if(this.dead && this.deathTimer < 0.3) return;
    ctx.save();
    const sx = this.x+this.shakeX, sy = this.y+this.shakeY;
    const glow = 20+Math.sin(this.glowPulse)*8;
    ctx.shadowBlur = glow; ctx.shadowColor = this.color;
    this._drawBody(ctx, sx, sy);
    if(this.dead){
      ctx.globalAlpha = this.deathTimer / 2;
    }
    ctx.restore();
    this.bullets.forEach(b=>b.draw(ctx));
  }
  _drawBody(ctx, x, y) { /* overridden */ }
}

// ── Boss 1: The Watcher ───────────────────────────────────────
class Boss1_Watcher extends Boss {
  constructor() {
    super('THE WATCHER', 1800, [
      {interval:1.2},{interval:0.9},{interval:0.65}
    ], '#aa44ff', W/2, -80);
    this.radius = 44; this.irisAngle = 0; this.pupilScale=1;
  }
  _getPhaseColors(){return['#aa44ff','#dd88ff','#ffffff','#5500aa'];}
  _firePattern(px,py,audio){
    const phase=this.phase, ai=this.attackIndex%6;
    audio.sfxEnemyHit();
    if(phase===0){
      if(ai%2===0) this._ring(14,150,5,'#cc66ff','#aa00ff');
      else this._aimed(px,py,3,0.22,180,5,'#ff88ff','#cc00ff');
      if(ai===4) this._spiral(5,130,4,'#ff44cc','#cc00aa');
    } else if(phase===1){
      this._ring(20,160,5,'#cc44ff','#9900cc');
      if(ai%2===0) this._aimed(px,py,5,0.18,200,5,'#ff66ff','#cc00ff');
      if(ai%3===0) this._spiral(7,140,4,'#ff44cc','#cc0099');
    } else {
      this._ring(24,175,5,'#bb33ff','#8800cc');
      this._ring(12,130,4,'#ff88ff','#cc44ff', Math.PI/12);
      this._aimed(px,py,7,0.16,220,4.5,'#ff55ee','#cc00cc');
      if(ai%2===0) this._spiral(9,155,4,'#ff44cc','#cc0099');
    }
  }
  _drawBody(ctx,x,y){
    // Outer sclera
    ctx.shadowColor='#8800ff'; ctx.shadowBlur=30;
    ctx.fillStyle='#1a0035';
    ctx.beginPath(); ctx.arc(x,y,this.radius,0,Math.PI*2); ctx.fill();
    // Ring
    ctx.strokeStyle='#aa44ff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,this.radius,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1; ctx.strokeStyle='#cc88ff55';
    for(let i=0;i<8;i++){
      const a=this.angle+i*Math.PI/4;
      ctx.beginPath(); ctx.arc(x,y,this.radius*0.7,0,Math.PI*2); ctx.stroke();
    }
    // Iris
    this.irisAngle += 0.02;
    const gradient = ctx.createRadialGradient(x,y,0,x,y,32);
    gradient.addColorStop(0,'#6600bb'); gradient.addColorStop(0.5,'#9933ff'); gradient.addColorStop(1,'#440088');
    ctx.fillStyle=gradient; ctx.shadowBlur=15; ctx.shadowColor='#9900ff';
    ctx.beginPath(); ctx.arc(x,y,32,0,Math.PI*2); ctx.fill();
    // Iris lines
    ctx.strokeStyle='#cc66ff66'; ctx.lineWidth=1.5;
    for(let i=0;i<12;i++){
      const a=this.irisAngle+i*Math.PI/6;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*30,y+Math.sin(a)*30); ctx.stroke();
    }
    // Pupil
    this.pupilScale = 0.8+Math.sin(this.glowPulse*2)*0.2;
    ctx.fillStyle='#000005'; ctx.shadowBlur=8; ctx.shadowColor='#000000';
    ctx.beginPath(); ctx.arc(x,y,14*this.pupilScale,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffff33';
    ctx.beginPath(); ctx.arc(x-5,y-5,4,0,Math.PI*2); ctx.fill();
    // Phase phase phase indicators
    const pColor=['#55ff55','#ffff55','#ff4444'][this.phase];
    ctx.fillStyle=pColor; ctx.shadowColor=pColor; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x+this.radius-8,y,5,0,Math.PI*2); ctx.fill();
  }
}

// ── Boss 2: Null Serpent ──────────────────────────────────────
class Boss2_Serpent extends Boss {
  constructor(){
    super('NULL SERPENT',2400,[
      {interval:1.0},{interval:0.75},{interval:0.5}
    ],'#00ff88',W/2,-80);
    this.radius=46; this.segments=[];
    for(let i=0;i<8;i++) this.segments.push({x:W/2,y:-80-i*20,angle:0});
    this.waveTimer=0;
  }
  _getPhaseColors(){return['#00ff88','#44ffbb','#ffffff','#00aa55'];}
  update(dt,px,py,audio,particles){
    super.update(dt,px,py,audio,particles);
    this.waveTimer+=dt;
    // Animate segments trailing head
    for(let i=this.segments.length-1;i>0;i--){
      this.segments[i].x+=(this.segments[i-1].x-this.segments[i].x)*dt*8;
      this.segments[i].y+=(this.segments[i-1].y-this.segments[i].y)*dt*8;
    }
    this.segments[0].x=this.x; this.segments[0].y=this.y;
  }
  _firePattern(px,py,audio){
    const phase=this.phase, ai=this.attackIndex%8;
    audio.sfxEnemyHit();
    if(phase===0){
      // Wave pattern
      for(let i=0;i<8;i++){
        const a=Math.PI/2+(i-3.5)*0.18;
        this._spawnBullet(this.x,this.y,Math.cos(a)*170,Math.sin(a)*170,5,'#00ff88','#00cc66');
      }
      if(ai%3===0) this._aimed(px,py,3,0.25,165,5,'#44ffbb','#00ff88');
    } else if(phase===1){
      // Cross wave
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2;
        this._spawnBullet(this.x,this.y,Math.cos(a)*175,Math.sin(a)*175,5,'#00ff88','#00aa44');
      }
      this._spiral(8,150,4,'#88ffcc','#00ff88');
      if(ai%2===0) this._aimed(px,py,5,0.2,195,5,'#44ffbb','#00ff88');
    } else {
      // Maximum serpent
      for(let i=0;i<18;i++){
        const a=this.angle*2+(i/18)*Math.PI*2;
        this._spawnBullet(this.x,this.y,Math.cos(a)*180,Math.sin(a)*180,5,'#00ff88','#00aa55');
      }
      this._aimed(px,py,7,0.15,210,5,'#44ffbb','#00ff88');
      if(ai%2===0){
        // Wall pattern
        for(let i=0;i<20;i++){
          const yOff=(i-10)*28;
          if(Math.abs(yOff)>280) continue;
          this._spawnBullet(W+10,this.y+yOff,-165+(Math.random()-0.5)*20,0,5,'#00dd77','#00ff88');
        }
      }
    }
  }
  _drawBody(ctx,x,y){
    // Segments
    for(let i=this.segments.length-1;i>=0;i--){
      const s=this.segments[i], t=1-i/this.segments.length;
      const r=10*t; if(r<2) continue;
      ctx.save();
      ctx.shadowBlur=15*t; ctx.shadowColor='#00ff88';
      ctx.fillStyle=`rgba(0,${Math.floor(180*t+50)},${Math.floor(100*t)},${t})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // Head body
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=25;
    const hg=ctx.createRadialGradient(x,y,0,x,y,this.radius);
    hg.addColorStop(0,'#00ff88cc'); hg.addColorStop(0.5,'#00aa5588'); hg.addColorStop(1,'#00330022');
    ctx.fillStyle=hg;
    ctx.beginPath();
    // Snake head shape
    ctx.save(); ctx.translate(x,y);
    ctx.rotate(this.angle*0.3);
    ctx.scale(1.2,1); ctx.beginPath(); ctx.arc(0,0,this.radius*0.85,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // Scales pattern
    ctx.strokeStyle='#00ff8844'; ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      const a=this.angle*0.5+i*Math.PI/3;
      ctx.beginPath();
      ctx.arc(x+Math.cos(a)*20,y+Math.sin(a)*20,10,0,Math.PI*2);
      ctx.stroke();
    }
    // Eyes
    [-16,16].forEach(ex=>{
      ctx.fillStyle='#001a00'; ctx.shadowBlur=4;
      ctx.beginPath(); ctx.arc(x+ex,y-12,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#00ff44'; ctx.shadowColor='#00ff44'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(x+ex,y-12,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x+ex,y-12,2.5,0,Math.PI*2); ctx.fill();
    });
    // Phase indicator
    const pColor=['#55ff55','#ffff55','#ff4444'][this.phase];
    ctx.fillStyle=pColor; ctx.shadowColor=pColor; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x,y+this.radius-8,5,0,Math.PI*2); ctx.fill();
  }
}

// ── Boss 3: Void Core ─────────────────────────────────────────
class Boss3_VoidCore extends Boss {
  constructor(){
    super('VOID CORE',3200,[
      {interval:1.1},{interval:0.8},{interval:0.55},{interval:0.35}
    ],'#ff6600',W/2,-80);
    this.radius=52; this.crystals=[];
    for(let i=0;i<6;i++) this.crystals.push({angle:i*Math.PI/3, dist:60, speed:0.8+i*0.1});
    this.laserTimer=0; this.laserActive=false; this.laserAngle=0;
  }
  _getPhaseColors(){return['#ff6600','#ff8800','#ffcc00','#ff0044','#ffffff'];}
  update(dt,px,py,audio,particles){
    super.update(dt,px,py,audio,particles);
    this.crystals.forEach((c,i)=>{
      c.angle+=dt*c.speed*(1+this.phase*0.3);
    });
    this.laserTimer-=dt;
    if(this.phase>=2 && this.laserTimer<=0){
      this.laserTimer=3-this.phase*0.5;
      this.laserActive=true;
      this.laserAngle=this._aimAngle(px,py);
      setTimeout(()=>{this.laserActive=false;},800);
    }
  }
  _firePattern(px,py,audio){
    const phase=this.phase, ai=this.attackIndex%10;
    audio.sfxEnemyHit();
    if(phase===0){
      this._ring(16,165,5,'#ff6600','#ff4400');
      if(ai%2===0) this._aimed(px,py,5,0.2,185,5,'#ffaa00','#ff6600');
    } else if(phase===1){
      this._ring(22,175,5,'#ff6600','#ff4400');
      this._spiral(10,160,4,'#ff8800','#ff6600');
      this._aimed(px,py,7,0.17,200,5,'#ffcc00','#ff8800');
    } else if(phase===2){
      this._ring(28,180,5,'#ff4400','#ff2200');
      this._ring(14,120,4,'#ffcc00','#ff8800',Math.PI/14);
      this._spiral(12,170,4,'#ff6600','#ff3300');
      if(ai%3===0) this._aimed(px,py,9,0.15,210,4.5,'#ff8800','#ff4400');
    } else {
      // Phase 3: full chaos
      this._ring(32,190,5,'#ff2200','#ff0000');
      this._ring(16,140,4,'#ffdd00','#ff8800',Math.PI/16);
      this._ring(8,200,5,'#ff44ff','#cc00ff',Math.PI/8);
      this._spiral(14,180,4,'#ff6600','#ff3300');
      this._aimed(px,py,11,0.13,215,4.5,'#ffaa00','#ff5500');
      // Scatter
      for(let i=0;i<6;i++){
        const a=Math.random()*Math.PI*2;
        this._spawnBullet(this.x,this.y,Math.cos(a)*240,Math.sin(a)*240,4,'#ff0000','#ff3300');
      }
    }
  }
  _drawBody(ctx,x,y){
    // Void core center
    ctx.shadowColor='#ff6600'; ctx.shadowBlur=40;
    const cg=ctx.createRadialGradient(x,y,0,x,y,this.radius);
    cg.addColorStop(0,'#ffcc0099'); cg.addColorStop(0.4,'#ff660088'); cg.addColorStop(1,'#ff000011');
    ctx.fillStyle=cg;
    ctx.save(); ctx.translate(x,y); ctx.rotate(this.angle);
    // Octagon
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4, r=this.radius;
      i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // Inner ring
    ctx.strokeStyle='#ff8800cc'; ctx.lineWidth=3; ctx.shadowBlur=20; ctx.shadowColor='#ff6600';
    ctx.beginPath(); ctx.arc(x,y,this.radius*0.75,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#ffcc0066'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,this.radius*0.45,0,Math.PI*2); ctx.stroke();
    // Orbiting crystals
    this.crystals.forEach((c,i)=>{
      const cx2=x+Math.cos(c.angle)*c.dist, cy2=y+Math.sin(c.angle)*c.dist;
      ctx.save();
      ctx.translate(cx2,cy2); ctx.rotate(c.angle*2);
      ctx.shadowColor='#ff8800'; ctx.shadowBlur=15;
      ctx.fillStyle='#ffaa44';
      ctx.beginPath();
      ctx.moveTo(0,-8); ctx.lineTo(5,0); ctx.lineTo(0,8); ctx.lineTo(-5,0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    // Laser
    if(this.laserActive){
      ctx.save();
      ctx.globalAlpha=0.85;
      ctx.strokeStyle='#ffcc00'; ctx.lineWidth=8; ctx.shadowBlur=30; ctx.shadowColor='#ff8800';
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(this.laserAngle)*700, y+Math.sin(this.laserAngle)*700);
      ctx.stroke();
      ctx.globalAlpha=0.4; ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(this.laserAngle)*700, y+Math.sin(this.laserAngle)*700);
      ctx.stroke();
      ctx.restore();
    }
    // Core glow center
    ctx.shadowColor='#ffffff'; ctx.shadowBlur=20;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(x,y,10+Math.sin(this.glowPulse*4)*2,0,Math.PI*2); ctx.fill();
    // Phase indicator
    const pColors=['#55ff55','#ffff55','#ff8800','#ff4444'][this.phase];
    ctx.fillStyle=pColors; ctx.shadowColor=pColors; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x,y+this.radius-8,5,0,Math.PI*2); ctx.fill();
  }
}

// ── Power Item ────────────────────────────────────────────────
class PowerItem {
  constructor(x,y){
    this.x=x; this.y=y; this.vy=80; this.alive=true; this.angle=0;
    this.type=Math.random()<0.2?'bomb':'power';
  }
  update(dt){
    this.y+=this.vy*dt; this.angle+=dt*3;
    if(this.y>H+20) this.alive=false;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    if(this.type==='bomb'){
      ctx.shadowBlur=12; ctx.shadowColor='#ff8800';
      ctx.fillStyle='#ff6600';
      ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffcc00';
      ctx.beginPath(); ctx.arc(-2,-2,3.5,0,Math.PI*2); ctx.fill();
    } else {
      ctx.shadowBlur=12; ctx.shadowColor='#00ffff';
      ctx.strokeStyle='#00ffff'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*4,Math.sin(a)*4);
        ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10);
        ctx.stroke();
      }
      ctx.fillStyle='#00eeff';
      ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── Game Manager ──────────────────────────────────────────────
class Game {
  constructor(){
    this.state='menu'; // menu|playing|bossTransition|gameOver|victory
    this.player=new Player();
    this.audio=new AudioEngine();
    this.particles=new ParticleSystem();
    this.starfield=new Starfield();
    this.bosses=[null,null,null];
    this.currentBoss=null;
    this.bossIndex=-1;
    this.enemyBullets=[];
    this.powerItems=[];
    this.keys={};
    this.prevKeys={};
    this.score=0; this.hiScore=0;
    this.screenShake=0;
    this.transitionTimer=0;
    this.menuTime=0;
    this.gameTime=0;
    this.isMuted=false;
    this.pauseTransition=false;
    this.lastTime=null;
    this._setupInput();
    this._setupAudioBtn();
    try {
      requestAnimationFrame(t=>this._loop(t));
    } catch(e) {
      console.error('Game loop error:', e);
    }
  }
  _setupInput(){
    // Give canvas keyboard focus so keys work immediately
    canvas.setAttribute('tabindex','0');
    canvas.style.outline = 'none';
    canvas.focus();

    // Keyboard input
    const onKey = (e) => {
      if(e.type==='keydown'){
        this.keys[e.code]=true;
        if(!e.repeat) this.audio.resume();
        if(e.code==='KeyX'||e.code==='Escape'){
          if(this.state==='playing') this.player.bomb(this.audio,this.particles,this.enemyBullets);
        }
      } else {
        this.keys[e.code]=false;
      }
      e.preventDefault();
      e.stopPropagation();
    };
    window.addEventListener('keydown', onKey, true);
    canvas.addEventListener('keydown', onKey, true);
    window.addEventListener('keyup', onKey, true);
    canvas.addEventListener('keyup', onKey, true);

    // Click / tap to start (critical for Chrome extension popup)
    const onInteract = (e) => {
      this.audio.resume();
      canvas.focus();
      if(this.state==='menu') this._startGame();
    };
    canvas.addEventListener('click', onInteract);
    canvas.addEventListener('touchend', onInteract, {passive:true});
    // Re-focus if popup loses and regains focus
    window.addEventListener('focus', () => canvas.focus(), true);
  }
  _setupAudioBtn(){
    const btn=document.getElementById('audioBtn');
    if(!btn) return;
    btn.addEventListener('click',()=>{
      this.isMuted=!this.isMuted;
      this.audio.setMute(this.isMuted);
      btn.textContent=this.isMuted?'🔇 MUTED':'🔊 SOUND';
      btn.classList.toggle('muted',this.isMuted);
    });
  }
  _keyPressed(code){ return this.keys[code] && !this.prevKeys[code]; }
  _loop(timestamp){
    try {
      if(!this.lastTime) this.lastTime=timestamp;
      let dt=Math.min((timestamp-this.lastTime)/1000, 0.05);
      this.lastTime=timestamp;
      this.prevKeys={...this.keys};
      this._update(dt);
      this._draw();
    } catch(e) {
      console.error('Frame error:', e);
    }
    requestAnimationFrame(t=>this._loop(t));
  }
  _update(dt){
    this.starfield.update(dt);
    this.particles.update(dt);
    if(this.screenShake>0) this.screenShake=Math.max(0,this.screenShake-dt*8);

    if(this.state==='menu'){
      this.menuTime+=dt;
      if(this._keyPressed('KeyZ')||this._keyPressed('Space')||this._keyPressed('Enter')){
        this._startGame();
      }
      return;
    }
    if(this.state==='gameOver'){
      if(this._keyPressed('KeyZ')||this._keyPressed('Space')||this._keyPressed('Enter')){
        this.state='menu'; this._reset();
      }
      return;
    }
    if(this.state==='victory'){
      if(this._keyPressed('KeyZ')||this._keyPressed('Space')||this._keyPressed('Enter')){
        this.state='menu'; this._reset();
      }
      return;
    }
    if(this.state==='bossTransition'){
      this.transitionTimer-=dt;
      if(this.transitionTimer<=0) this._spawnNextBoss();
      return;
    }

    // Playing state
    this.gameTime+=dt;
    this.player.update(dt,this.keys,this.audio,this.particles);

    // Power items
    for(let i=this.powerItems.length-1;i>=0;i--){
      const item=this.powerItems[i];
      item.update(dt);
      if(!item.alive){ this.powerItems.splice(i,1); continue; }
      const dx=item.x-this.player.x, dy=item.y-this.player.y;
      if(Math.sqrt(dx*dx+dy*dy)<20 && this.player.alive){
        if(item.type==='bomb') { this.player.bombs=Math.min(5,this.player.bombs+1); }
        else { this.player.power=Math.min(5,this.player.power+1); }
        this.audio.sfxPowerUp();
        this.particles.emit(item.x,item.y,8,['#00ffff','#ffffff','#88ffff'],[40,120],[0.3,0.7],[2,5],['#00ffff']);
        this.powerItems.splice(i,1);
      }
    }

    // Boss update & collision
    if(this.currentBoss && this.currentBoss.alive){
      this.currentBoss.update(dt,this.player.x,this.player.y,this.audio,this.particles);
      // Collect enemy bullets into shared array
      this.enemyBullets=this.currentBoss.bullets;

      // Player bullets vs boss
      for(let i=this.player.bullets.length-1;i>=0;i--){
        const pb=this.player.bullets[i];
        const dx=pb.x-this.currentBoss.x, dy=pb.y-this.currentBoss.y;
        if(Math.sqrt(dx*dx+dy*dy)<this.currentBoss.radius*0.85){
          this.currentBoss.hit(12,this.particles);
          pb.alive=false;
          this.score+=15;
          this.audio.sfxEnemyHit();
        }
      }

      // Enemy bullets vs player
      if(this.player.alive && this.player.invincible<=0){
        for(let i=this.enemyBullets.length-1;i>=0;i--){
          const eb=this.enemyBullets[i];
          const dx=eb.x-this.player.x, dy=eb.y-this.player.y;
          const dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<eb.radius+this.player.radius){
            this.player.hit(this.audio,this.particles);
            eb.alive=false;
            this.screenShake=0.6;
            if(!this.player.alive){
              this.hiScore=Math.max(this.hiScore,this.score);
              setTimeout(()=>{this.state='gameOver';},2000);
            }
          } else if(dist<eb.radius+24 && this.player.invincible<=0){
            // Graze
            if(this.player.grazeTimer<=0){
              this.score+=5; this.player.grazeTimer=0.08;
              this.player.graze++;
              this.particles.emit(this.player.x,this.player.y,2,['#ffff00'],[20,60],[0.1,0.2],[1,3],['#ffff00']);
            }
          }
        }
      }

      // Boss dead
      if(!this.currentBoss.alive){
        this.audio.sfxExplosion();
        this.score+=5000+this.bossIndex*2000;
        this.hiScore=Math.max(this.hiScore,this.score);
        // Drop items
        for(let i=0;i<5;i++){
          this.powerItems.push(new PowerItem(
            this.currentBoss.x+(Math.random()-0.5)*60,
            this.currentBoss.y+(Math.random()-0.5)*40
          ));
        }
        if(this.bossIndex>=2){
          this.audio.stopBGM();
          this.audio.sfxVictory();
          setTimeout(()=>{this.state='victory';},2500);
        } else {
          this.state='bossTransition';
          this.transitionTimer=3;
          this.audio.stopBGM();
        }
        this.currentBoss=null;
        this.enemyBullets=[];
      }
    }

    // Player death
    if(!this.player.alive && this.player.deathTimer<=0 && this.state==='playing'){
      this.hiScore=Math.max(this.hiScore,this.score);
      this.state='gameOver';
    }
  }

  _draw(){
    const sx=(Math.random()-0.5)*this.screenShake*18;
    const sy=(Math.random()-0.5)*this.screenShake*10;
    ctx.save();
    ctx.translate(sx,sy);

    // Background
    ctx.fillStyle='#000008';
    ctx.fillRect(-20,-20,W+40,H+40);
    this.starfield.draw(ctx);

    if(this.state==='menu'){
      this._drawMenu();
      ctx.restore();
      return;
    }
    if(this.state==='gameOver'){
      this._drawGameOver();
      ctx.restore();
      return;
    }
    if(this.state==='victory'){
      this._drawVictory();
      ctx.restore();
      return;
    }
    if(this.state==='bossTransition'){
      this._drawTransition();
      ctx.restore();
      return;
    }

    this.particles.draw(ctx);
    this.player.drawBullets(ctx);
    if(this.currentBoss) this.currentBoss.draw(ctx);
    this.powerItems.forEach(p=>p.draw(ctx));
    this.player.draw(ctx);
    ctx.restore();
    this._drawHUD();
  }

  _drawMenu(){
    // Title
    const t=this.menuTime;
    ctx.save();
    ctx.shadowBlur=40; ctx.shadowColor='#8800ff';
    ctx.textAlign='center';
    // BULLET HELL
    ctx.font='bold 38px "Courier New"';
    ctx.fillStyle='#cc66ff';
    ctx.shadowColor='#aa00ff'; ctx.shadowBlur=30;
    ctx.fillText('BULLET HELL', W/2, 130+Math.sin(t*1.2)*4);
    // VOID
    ctx.font='bold 60px "Courier New"';
    ctx.fillStyle='#ffffff';
    ctx.shadowColor='#cc00ff'; ctx.shadowBlur=50;
    ctx.fillText('VOID', W/2, 185+Math.sin(t*1.2)*4);
    // Separator
    ctx.shadowBlur=10; ctx.shadowColor='#6600cc';
    ctx.strokeStyle='#6600cc'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(W/2-120,205); ctx.lineTo(W/2+120,205); ctx.stroke();
    // Controls
    ctx.font='13px "Courier New"';
    ctx.fillStyle='#9966cc';
    ctx.shadowBlur=5; ctx.shadowColor='#6600aa';
    const controls=['WASD / ARROWS — Move','Z / SPACE    — Shoot','X / ESC      — Bomb','SHIFT        — Focus (slow + hitbox)'];
    controls.forEach((c,i)=>{ ctx.fillText(c, W/2, 240+i*22); });
    // Boss info
    ctx.fillStyle='#664488'; ctx.font='11px "Courier New"';
    ctx.fillText('3 BOSSES  ·  EACH WITH UNIQUE PHASES', W/2, 350);
    // Press Z
    ctx.fillStyle=Math.sin(t*3)>0?'#cc88ff':'#8844cc';
    ctx.shadowColor='#aa00ff'; ctx.shadowBlur=20;
    ctx.font='bold 16px "Courier New"';
    ctx.fillText('CLICK  or  PRESS  Z  TO  START', W/2, 420);
    // pulsing arrow
    ctx.font='20px "Courier New"';
    ctx.fillStyle=Math.sin(t*4)>0?'#cc88ff':'#6600aa';
    ctx.fillText('▼', W/2, 445);
    // Animated bullets in bg
    for(let i=0;i<8;i++){
      const a=t*0.4+i*Math.PI/4;
      const bx=W/2+Math.cos(a)*160, by=300+Math.sin(a*1.3)*80;
      ctx.fillStyle=['#cc44ff','#00ffcc','#ff6600','#ff44cc'][i%4];
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(bx,by,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  _drawHUD(){
    ctx.save();
    // Score
    ctx.font='bold 14px "Courier New"'; ctx.textAlign='left';
    ctx.fillStyle='#aa88cc'; ctx.shadowBlur=0;
    ctx.fillText('SCORE', 10, 22);
    ctx.fillStyle='#ffffff'; ctx.font='bold 18px "Courier New"';
    ctx.fillText(String(this.score).padStart(10,'0'), 10, 44);
    ctx.fillStyle='#664488'; ctx.font='10px "Courier New"';
    ctx.fillText('HI '+String(this.hiScore).padStart(10,'0'), 10, 60);

    // Lives
    ctx.textAlign='right';
    ctx.fillStyle='#aa88cc'; ctx.font='11px "Courier New"';
    ctx.fillText('LIVES', W-10, 22);
    for(let i=0;i<this.player.lives;i++){
      ctx.fillStyle='#44ccff'; ctx.shadowBlur=8; ctx.shadowColor='#00ccff';
      const lx=W-15-i*22;
      ctx.beginPath();
      ctx.moveTo(lx,38); ctx.lineTo(lx-8,52); ctx.lineTo(lx,48); ctx.lineTo(lx+8,52);
      ctx.closePath(); ctx.fill();
    }
    // Bombs
    ctx.fillStyle='#aa88cc'; ctx.font='11px "Courier New"';
    ctx.fillText('BOMBS', W-10, 64);
    for(let i=0;i<this.player.bombs;i++){
      ctx.fillStyle='#ff8844'; ctx.shadowBlur=6; ctx.shadowColor='#ff6600';
      ctx.beginPath(); ctx.arc(W-15-i*18,76,5,0,Math.PI*2); ctx.fill();
    }

    // Boss HP bar
    if(this.currentBoss && this.currentBoss.introDone){
      const barW=W-20, barH=12, barX=10, barY=H-20;
      const hpRatio=Math.max(0,this.currentBoss.hp/this.currentBoss.maxHp);
      // Phase segments
      const phases=this.currentBoss.phases.length;
      ctx.fillStyle='#110022'; ctx.fillRect(barX,barY,barW,barH);
      const barColor=['#aa44ff','#00ff88','#ff6600'][this.bossIndex%3];
      ctx.fillStyle=barColor;
      ctx.shadowBlur=8; ctx.shadowColor=barColor;
      ctx.fillRect(barX,barY,barW*hpRatio,barH);
      // Phase separators
      ctx.strokeStyle='#ffffff44'; ctx.lineWidth=1;
      for(let i=1;i<phases;i++){
        const sepX=barX+barW*(i/phases);
        ctx.beginPath(); ctx.moveTo(sepX,barY); ctx.lineTo(sepX,barY+barH); ctx.stroke();
      }
      // Border
      ctx.shadowBlur=0; ctx.strokeStyle='#441166'; ctx.lineWidth=1;
      ctx.strokeRect(barX,barY,barW,barH);
      // Boss name
      ctx.fillStyle='#cc88ff'; ctx.font='bold 11px "Courier New"'; ctx.textAlign='center';
      ctx.shadowBlur=4; ctx.shadowColor='#8800ff';
      ctx.fillText(this.currentBoss.name+' — PHASE '+(this.currentBoss.phase+1)+'/'+phases, W/2, barY-6);
    }
    // Graze
    if(this.player.graze>0){
      ctx.textAlign='center';
      ctx.fillStyle='#ffff88'; ctx.font='10px "Courier New"'; ctx.shadowBlur=0;
      ctx.fillText('GRAZE: '+this.player.graze, W/2, H-30);
    }
    ctx.restore();
  }

  _drawTransition(){
    ctx.save(); ctx.textAlign='center';
    const names=['THE WATCHER','NULL SERPENT','VOID CORE'];
    const colors=['#aa44ff','#00ff88','#ff6600'];
    const nIdx=this.bossIndex+1;
    ctx.fillStyle=colors[nIdx]||'#ffffff';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=30;
    ctx.font='bold 14px "Courier New"';
    ctx.fillText('NEXT BOSS', W/2, H/2-40);
    ctx.font='bold 32px "Courier New"';
    ctx.fillText(names[nIdx]||'???', W/2, H/2);
    ctx.font='12px "Courier New"'; ctx.fillStyle='#664488'; ctx.shadowBlur=0;
    ctx.fillText('APPROACH...', W/2, H/2+35);
    ctx.restore();
    this.particles.draw(ctx);
  }

  _drawGameOver(){
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle='#ff4444'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=30;
    ctx.font='bold 42px "Courier New"';
    ctx.fillText('GAME OVER', W/2, H/2-40);
    ctx.fillStyle='#cc88ff'; ctx.shadowBlur=10; ctx.shadowColor='#8800ff';
    ctx.font='14px "Courier New"';
    ctx.fillText('SCORE: '+String(this.score).padStart(10,'0'), W/2, H/2+10);
    ctx.fillText('HI:    '+String(this.hiScore).padStart(10,'0'), W/2, H/2+32);
    ctx.fillStyle=Math.sin(this.gameTime*4)>0?'#cc88ff':'#664488';
    ctx.font='13px "Courier New"'; ctx.shadowBlur=0;
    ctx.fillText('PRESS Z / SPACE TO RETRY', W/2, H/2+72);
    ctx.restore();
    this.particles.draw(ctx);
  }

  _drawVictory(){
    const t=this.gameTime;
    ctx.save(); ctx.textAlign='center';
    ctx.shadowColor='#ffcc00'; ctx.shadowBlur=40;
    ctx.fillStyle='#ffcc00'; ctx.font='bold 38px "Courier New"';
    ctx.fillText('VOID CLEARED!', W/2, H/2-60+Math.sin(t*2)*4);
    ctx.fillStyle='#ffffff'; ctx.shadowColor='#ffffff'; ctx.shadowBlur=20;
    ctx.font='bold 18px "Courier New"';
    ctx.fillText('ALL BOSSES DEFEATED', W/2, H/2-18);
    ctx.fillStyle='#cc88ff'; ctx.shadowBlur=5; ctx.shadowColor='#8800ff';
    ctx.font='14px "Courier New"';
    ctx.fillText('FINAL SCORE: '+String(this.score).padStart(10,'0'), W/2, H/2+18);
    ctx.fillText('HI SCORE:    '+String(this.hiScore).padStart(10,'0'), W/2, H/2+42);
    ctx.fillStyle=Math.sin(t*3)>0?'#ffcc00':'#886600';
    ctx.font='13px "Courier New"'; ctx.shadowBlur=0;
    ctx.fillText('PRESS Z / SPACE TO PLAY AGAIN', W/2, H/2+84);
    // Celebratory particles
    if(Math.random()<0.5){
      const cx=Math.random()*W, cy=Math.random()*H;
      this.particles.emit(cx,cy,5,['#ffcc00','#ff6600','#ffffff','#ff44ff','#00ffff'],
        [60,200],[0.4,1.0],[2,5],['#ffcc00','#ff6600']);
    }
    ctx.restore();
    this.particles.draw(ctx);
  }

  _startGame(){
    this._reset();
    this.state='bossTransition';
    this.bossIndex=-1;
    this.transitionTimer=0.5;
    this.audio.resume();
  }
  _reset(){
    this.player=new Player();
    this.particles.clear();
    this.powerItems=[];
    this.enemyBullets=[];
    this.currentBoss=null;
    this.score=0;
    this.gameTime=0;
    this.screenShake=0;
    this.audio.stopBGM();
  }
  _spawnNextBoss(){
    this.bossIndex++;
    if(this.bossIndex===0) this.currentBoss=new Boss1_Watcher();
    else if(this.bossIndex===1) this.currentBoss=new Boss2_Serpent();
    else this.currentBoss=new Boss3_VoidCore();
    this.enemyBullets=this.currentBoss.bullets;
    this.state='playing';
    this.audio.startBGM(this.bossIndex);
    // Restore player between bosses
    if(this.bossIndex>0){
      this.player.invincible=2;
      this.player.bombs=Math.max(1,this.player.bombs);
    }
  }
}

// ── Init ──────────────────────────────────────────────────────
// Script runs after canvas exists (placed at bottom of <body>)
new Game();

  </script>
